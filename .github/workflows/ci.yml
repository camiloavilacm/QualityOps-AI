name: Offline Verification CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-contracts-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch pinned read-only qa-features reference (e7c566ff)
        run: |
          mkdir -p ../qa-workspace/qa-features
          git -C ../qa-workspace/qa-features init -q
          git -C ../qa-workspace/qa-features remote add origin https://github.com/camiloavilacm/qa-features.git
          git -C ../qa-workspace/qa-features fetch --depth 1 origin e7c566ff831139889195643a1b906b7edab76f48
          git -C ../qa-workspace/qa-features checkout -q FETCH_HEAD
          mkdir -p ../qa-workspace/qa-features/harness/evidence/readme-runs/failure
          cp -R samples/recorded/archive-failure/. ../qa-workspace/qa-features/harness/evidence/readme-runs/failure/
          echo "QUALITYOPS_QA_FEATURES_ROOT=$(cd ../qa-workspace/qa-features && pwd)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned Python harness dependency
        run: pip install --no-cache-dir -r harness/requirements.txt "jsonschema[format-nongpl]==4.26.0"

      - name: Verify contracts and container-launcher components
        run: |
          python -B harness/checks.py contracts
          python -B -m unittest -v harness.test_pr_verification

      - name: Run A1 ingestion and deterministic gate tests
        run: python -B -m unittest -v backend.ingestion.test_importer backend.gate.test_gate

      - name: Run B2 read-only investigator and retrieval tests
        run: python -B -m unittest -v backend.investigator.test_investigator backend.investigator.test_retrieval

      - name: Run B1 offline evaluation and grader tests
        run: python -B -m unittest discover -s evaluators -p test_evaluate.py -v

      - name: Run Stage 2 vertical-slice integration tests
        run: python -B -m unittest -v tests/test_vertical_slice.py

      - name: Verify sanitized dashboard exports
        run: |
          python -B frontend/scripts/export_mixed.py --check
          python -B frontend/scripts/export_showcase.py --check

      - name: Record sanitized export digests
        run: sha256sum frontend/src/mixed-campaign.json frontend/src/showcase-export.json

  frontend-e2e:
    # Bootstrap feedback only. This workflow cannot accept its own verifier revision.
    # Trusted candidate overlays run separately from a human-accepted verifier checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout infrastructure snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up host launcher Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Set up host launcher Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fetch pinned read-only qa-features reference (e7c566ff)
        run: |
          mkdir -p ../qa-workspace/qa-features
          git -C ../qa-workspace/qa-features init -q
          git -C ../qa-workspace/qa-features remote add origin https://github.com/camiloavilacm/qa-features.git
          git -C ../qa-workspace/qa-features fetch --depth 1 origin e7c566ff831139889195643a1b906b7edab76f48
          git -C ../qa-workspace/qa-features checkout -q FETCH_HEAD
          mkdir -p ../qa-workspace/qa-features/harness/evidence/readme-runs/failure
          cp -R samples/recorded/archive-failure/. ../qa-workspace/qa-features/harness/evidence/readme-runs/failure/
          echo "QUALITYOPS_QA_FEATURES_ROOT=$(cd ../qa-workspace/qa-features && pwd)" >> "$GITHUB_ENV"
      - name: Install pinned Python harness dependency
        run: pip install --no-cache-dir -r harness/requirements.txt "jsonschema[format-nongpl]==4.26.0"
      - name: Check independent report validator
        run: node --test harness/test_pr_reports.mjs
      - name: Run cumulative Linux amd64 Stage 3 verification
        run: |
          revision=$(git rev-parse HEAD)
          node harness/run_pr_verification.mjs --bootstrap --stage 3 --verifier-revision "$revision" --candidate-revision "$revision" --output harness/artifacts/container-stage3
      - name: Preserve cumulative bootstrap evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-stage3-${{ github.run_id }}-${{ github.run_attempt }}
          # Only the stopped-container, bounded regular-file collection is uploadable.
          path: harness/artifacts/container-stage3/publication/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve local red-team evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-red-team-${{ github.run_id }}-${{ github.run_attempt }}
          # The matrix runs in the trusted isolated container; only bounded sanitized JSON is uploadable.
          path: harness/artifacts/container-stage3/publication/container/red-team/publication/
          retention-days: 7
          if-no-files-found: error

  frontend-webmcp:
    # Cumulative Stage 4 browser evidence; bootstrap feedback is not verifier acceptance.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout infrastructure snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up host launcher Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Set up host launcher Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fetch pinned read-only qa-features reference (e7c566ff)
        run: |
          mkdir -p ../qa-workspace/qa-features
          git -C ../qa-workspace/qa-features init -q
          git -C ../qa-workspace/qa-features remote add origin https://github.com/camiloavilacm/qa-features.git
          git -C ../qa-workspace/qa-features fetch --depth 1 origin e7c566ff831139889195643a1b906b7edab76f48
          git -C ../qa-workspace/qa-features checkout -q FETCH_HEAD
          mkdir -p ../qa-workspace/qa-features/harness/evidence/readme-runs/failure
          cp -R samples/recorded/archive-failure/. ../qa-workspace/qa-features/harness/evidence/readme-runs/failure/
          echo "QUALITYOPS_QA_FEATURES_ROOT=$(cd ../qa-workspace/qa-features && pwd)" >> "$GITHUB_ENV"
      - name: Install pinned Python harness dependency
        run: pip install --no-cache-dir -r harness/requirements.txt "jsonschema[format-nongpl]==4.26.0"
      - name: Validate WebMCP report checker
        run: node --check harness/check_webmcp_report.mjs
      - name: Run cumulative Linux amd64 Stage 4 verification
        run: |
          revision=$(git rev-parse HEAD)
          node harness/run_pr_verification.mjs --bootstrap --stage 4 --verifier-revision "$revision" --candidate-revision "$revision" --output harness/artifacts/container-stage4
      - name: Preserve cumulative WebMCP evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-stage4-${{ github.run_id }}-${{ github.run_attempt }}
          path: harness/artifacts/container-stage4/publication/
          retention-days: 7
          if-no-files-found: error
